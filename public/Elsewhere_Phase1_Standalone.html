.app-view .field,.app-view .chat-drawer,.app-view .compose,.chat-view .compose,.chat-view .chat-drawer,.intermission-compose{background:rgba(255,255,255,.43)!important;border-color:rgba(255,255,255,.64)!important;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%)}
.app-view .viewport,.chat-view .chat-history{background:transparent}.role,.role-row{background:rgba(255,255,255,.09)}
.login-list{color:var(--ink);overflow:hidden}.landing-mark{background:rgba(255,255,255,.48);border-color:#fff}.landing .lead,.logo{color:var(--muted)}.landing .brand{color:var(--ink)}
/* Real backstage window: visual and semantic separation from the fictional novel. */
.intermission-view{display:flex;flex-direction:column;min-height:0}.intermission-top{flex-shrink:0;gap:8px}.intermission-top h1{font-size:15px}.intermission-top .small{font-size:10px;color:var(--muted)}
.pause-pill{font:700 9px/1 -apple-system,sans-serif;letter-spacing:1.3px;background:rgba(255,255,255,.56);border:1px solid #ffffffc9;border-radius:20px;padding:9px 10px;color:var(--accent)}
.intermission-summary{margin:14px 17px 7px;padding:17px 19px;background:rgba(255,255,255,.42);border:1px solid #ffffffdf;box-shadow:var(--glass-darkshadow);border-radius:23px;backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px)}
.intermission-kicker{color:var(--accent);font-size:10px;font-weight:750;letter-spacing:2px;margin-bottom:8px}.intermission-summary strong{font-size:17px;letter-spacing:-.2px}.intermission-summary p{font-size:12px;color:var(--muted);line-height:1.7;margin:8px 0 0}
.intermission-history{min-height:0;flex:1;overflow-y:auto;padding:17px max(17px,calc((100% - 760px)/2));display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
.intermission-empty{margin:auto;text-align:center;font-size:13px;max-width:270px;line-height:1.8;color:var(--muted);background:rgba(255,255,255,.24);border:1px solid #ffffff8c;border-radius:23px;padding:25px 19px}
.offstage-message{display:flex;flex-direction:column;gap:5px;max-width:80%;align-self:flex-start}.offstage-me{align-self:flex-end;align-items:flex-end}.offstage-name{font-size:11px;color:var(--muted);padding:0 7px}.offstage-bubble{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.65;padding:11px 14px;border-radius:18px 18px 18px 5px;background:rgba(255,255,255,.58);border:1px solid #fffc;box-shadow:0 5px 18px #51477a10;backdrop-filter:blur(15px)}.offstage-me .offstage-bubble{background:color-mix(in srgb,var(--accent) 22%,#fff8);border-radius:18px 18px 5px 18px}.offstage-message time{font-size:9px;color:var(--muted);padding:0 7px}
.intermission-tools{flex:none;margin:0 14px 8px;background:rgba(255,255,255,.44);border:1px solid #fffd;border-radius:18px;max-height:min(42dvh,370px);overflow-y:auto}.intermission-tools summary{list-style:none;cursor:pointer;font-size:13px;font-weight:650;padding:12px 16px;display:flex;justify-content:space-between}.intermission-tools summary::-webkit-details-marker{display:none}.intermission-tools form{display:grid;gap:8px;padding:0 14px 12px}.intermission-tools label{font-size:12px;color:var(--muted)}.intermission-tools .field{min-height:62px;background:rgba(255,255,255,.64)}.intermission-tools > .btn{margin:0 14px 10px;width:calc(100% - 28px)}.intermission-tools > .sub{padding:0 14px 12px;font-size:11px}
.intermission-compose{flex-shrink:0;background:rgba(255,255,255,.47);box-shadow:0 -6px 25px #292b4a12}
[data-theme=night] .home-widget,[data-theme=night] .mini-widget,[data-theme=night] .dock,[data-theme=night] .card,[data-theme=night] .intermission-summary,[data-theme=night] .offstage-bubble{background:rgba(41,41,65,.60)!important;border-color:rgba(225,221,255,.24)!important;box-shadow:0 12px 30px #05040b31}
@media(max-width:380px){.home-apps{gap:10px 2px}.home-apps .tile{width:48px;height:48px}.dock .tile{width:49px;height:49px}.intermission-summary{margin-top:8px;padding:12px}.intermission-summary p{font-size:11px}}
@media(prefers-reduced-transparency:reduce){.home-widget,.mini-widget,.dock,.card,.intermission-summary,.offstage-bubble{background:var(--surface)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}}
/* Keep both stage actions visible even on 320–393px iPhones. */
.novel-view .top{padding:6px 10px;gap:5px;min-height:54px}
.novel-view .top .back-btn{min-width:24px;width:24px;font-size:26px;flex:none}
.novel-view .top .grow{min-width:0;flex:1;overflow:hidden}
.novel-view .top h1{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.novel-view .top .btn.small{flex:none;font-size:11px;padding:8px 7px;border-radius:10px}
.intermission-top .back-btn{min-width:88px;flex:none;font-size:23px}.intermission-top .back-btn span{font-size:11px}
@media(max-width:345px){.novel-view .top h1{font-size:11px}.novel-view .top .btn.small{font-size:10px;padding:7px 5px}.intermission-top .back-btn{min-width:74px}.intermission-top h1{font-size:12px}}
.novel-view .top button.btn.small{display:inline-flex;align-items:center;justify-content:center}

/* Toast notification */
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:99;background:rgba(36,31,46,.88);color:#fff;padding:10px 16px;border-radius:99px;font-size:12px;box-shadow:0 8px 25px rgba(0,0,0,.22);backdrop-filter:blur(12px);max-width:min(90vw,420px);text-align:center;pointer-events:none}

/* Phase 1 — P1-2: Message actions (Quote, Edit, Regenerate, Retract) & Revision History */
.message-meta-row{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.message.mine .message-meta-row{justify-content:flex-end}
.message-meta-row small{margin-top:0}
.edited-tag{font-size:9px;color:var(--accent);opacity:.85}
.msg-actions{display:inline-flex;align-items:center;gap:4px;opacity:.78;transition:opacity .15s}
.message:hover .msg-actions,.passage:hover .msg-actions,.msg-actions:focus-within{opacity:1}
.msg-action-btn{border:0;background:rgba(255,255,255,.45);color:var(--muted);font-size:10px;padding:2px 7px;border-radius:99px;line-height:1.4;border:1px solid rgba(255,255,255,.55)}
.msg-action-btn:hover{color:var(--accent);background:rgba(255,255,255,.78)}
[data-theme=night] .msg-action-btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)}

.bubble-quote{margin-bottom:7px;padding:6px 9px;border-left:2.5px solid var(--accent);background:rgba(255,255,255,.38);border-radius:6px 10px 10px 6px;font-size:11px;line-height:1.45;color:var(--muted)}
.bubble-quote b{display:block;color:var(--accent);font-size:10px;margin-bottom:2px}
[data-theme=night] .bubble-quote{background:rgba(0,0,0,.22)}

.compose-quote-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 16px;background:rgba(255,255,255,.52);border-top:1px solid var(--glass-stroke);font-size:11px;color:var(--ink);backdrop-filter:blur(18px);flex-shrink:0}
.compose-quote-bar .quote-preview{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2.5px solid var(--accent);padding-left:8px}
.compose-quote-bar button{border:0;background:var(--surface2);color:var(--muted);border-radius:99px;padding:3px 9px;font-size:11px}
[data-theme=night] .compose-quote-bar{background:rgba(41,41,65,.72)}

.inline-edit-form{display:flex;flex-direction:column;gap:6px;min-width:min(260px,74vw);margin-top:4px;padding:9px;border-radius:14px;background:rgba(255,255,255,.72);border:1px solid var(--glass-stroke);backdrop-filter:blur(16px)}
.inline-edit-form textarea{width:100%;min-height:60px;border:1px solid var(--surface2);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--surface);color:var(--ink);resize:vertical}
.inline-edit-actions{display:flex;justify-content:flex-end;gap:6px}
[data-theme=night] .inline-edit-form{background:rgba(41,41,65,.85)}

.revision-drawer{padding:12px clamp(14px,3vw,36px);background:rgba(255,255,255,.65);border-bottom:1px solid var(--glass-stroke);max-height:min(42vh,340px);overflow-y:auto;backdrop-filter:blur(26px);flex-shrink:0}
.revision-list{display:flex;flex-direction:column;gap:8px;max-width:900px;margin:0 auto}
.revision-item{padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.62);border:1px solid var(--glass-stroke);font-size:11px;line-height:1.55}
.revision-item-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px;margin-bottom:4px}
.revision-badge{display:inline-block;padding:1px 7px;border-radius:99px;background:var(--surface2);color:var(--accent);font-weight:650;margin-right:6px}
.revision-old{color:var(--muted);text-decoration:line-through;white-space:pre-wrap;overflow-wrap:anywhere}
.revision-new{color:var(--ink);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
[data-theme=night] .revision-drawer,[data-theme=night] .revision-item{background:rgba(41,41,65,.78)}

/* Phase 1 — P1-3: Character First Message Honest Status Card */
.first-message-card{max-width:560px;margin:12px auto;padding:16px 18px;border-radius:20px;background:var(--glass-fill);border:1px solid var(--glass-stroke);box-shadow:var(--glass-darkshadow);backdrop-filter:blur(24px);text-align:left}
.first-message-card h3{margin:0 0 6px;font-size:14px;color:var(--ink)}
.first-message-card p{margin:0 0 12px;font-size:12px;line-height:1.65;color:var(--muted)}
.first-message-actions{display:flex;flex-wrap:wrap;gap:8px}

/* Phase 1 — P1-4: User Diary Sharing Bar & Badge */
.diary-entry-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid rgba(150,140,170,.16);flex-wrap:wrap}
.privacy-badge{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.shared-badge{font-size:11px;color:var(--accent);background:var(--surface2);padding:3px 9px;border-radius:99px;font-weight:600}

/* Phase 1 — P1-1: Cross-origin / file:// Backup & Standalone Bar on Landing */
.landing-backup-bar{margin-top:2px;padding:13px 16px;border-radius:22px;background:var(--glass-fill);border:1px solid var(--glass-stroke);box-shadow:var(--glass-darkshadow);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink);flex-shrink:0}
.landing-backup-info{display:flex;flex-direction:column;gap:2px;flex:1;min-width:180px}
.landing-backup-title{font-size:12px;font-weight:700;color:var(--ink)}
.landing-backup-bar span{color:var(--muted);font-size:11px;line-height:1.45}
.landing-backup-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.header-right-group{display:flex;align-items:center;gap:6px}

/* UI/UX 01 — Landing / Character Selector Dual Liquid Glass Cards */
.landing{
  flex:1 1 0%;
  min-height:0;
  width:100%;
  max-width:560px;
  margin:0 auto;
  padding:clamp(14px, 3vh, 28px) clamp(14px, 4vw, 24px) clamp(20px, 4vh, 34px);
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.landing-heading{
  margin-bottom:2px;
  flex-shrink:0;
}
.landing-card{
  position:relative;
  display:flex;
  flex-direction:column;
  min-height:0;
  flex-shrink:0;
  border-radius:24px;
  background:var(--glass-fill);
  border:1px solid var(--glass-stroke);
  box-shadow:var(--glass-darkshadow);
  backdrop-filter:blur(28px) saturate(185%);
  -webkit-backdrop-filter:blur(28px) saturate(185%);
  overflow:hidden;
}
.landing-card::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(145deg, rgba(255,255,255,.36) 0%, rgba(255,255,255,.08) 42%, transparent 72%);
  opacity:.72;
}
.landing-card-header{
  position:relative;
  z-index:2;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 16px 11px;
  border-bottom:1px solid rgba(150,140,170,.16);
  background:rgba(255,255,255,.26);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}
.landing-card-title-group{
  display:flex;
  align-items:baseline;
  gap:8px;
  flex-wrap:wrap;
  min-width:0;
}
.landing-card-title{
  margin:0;
  font-size:13px;
  font-weight:750;
  letter-spacing:.03em;
  color:var(--ink);
}
.landing-card-subtitle{
  font-size:11px;
  color:var(--muted);
  font-weight:500;
}
.landing-role-count{
  display:inline-flex;
  align-items:center;
  padding:2px 8px;
  border-radius:99px;
  font-size:11px;
  font-weight:650;
  color:var(--accent);
  background:var(--surface2);
}
.landing-create-btn{
  flex-shrink:0;
  white-space:nowrap;
  padding:6px 12px;
  font-size:12px;
  border-radius:99px;
}
.landing-card-action{
  flex-shrink:0;
  white-space:nowrap;
  padding:5px 10px;
  font-size:11px;
  border-radius:99px;
}
.landing-card-body{
  position:relative;
  z-index:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
  padding:10px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.landing-profile-scroll{
  max-height:clamp(124px, 24dvh, 210px);
}
.landing-roles-scroll{
  max-height:clamp(190px, 38dvh, 370px);
}
.landing-card-body .role{
  margin:0;
  flex-shrink:0;
}
.landing-card-body .role:last-child{
  border-bottom:0;
}
.landing-card-body .login-role-info{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:2px;
  min-width:0;
  flex:1;
  text-align:left;
}
.landing-card-body .login-role-info .who,
.landing-card-body .login-role-info .about{
  display:block;
  width:100%;
}
.landing-user-details{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:10px 12px;
  border-radius:16px;
  background:rgba(255,255,255,.46);
  border:1px solid var(--glass-stroke);
}
.landing-user-detail-item{
  display:flex;
  flex-direction:column;
  gap:3px;
}
.landing-user-detail-item .detail-label{
  font-size:10px;
  font-weight:700;
  color:var(--accent);
  letter-spacing:.03em;
}
.landing-user-detail-item .detail-text{
  font-size:12px;
  line-height:1.58;
  color:var(--ink);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.landing-empty-roles{
  padding:20px 14px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}
[data-theme=night] .landing-card::before{
  background:linear-gradient(145deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,.02) 45%, transparent 75%);
}
[data-theme=night] .landing-card-header{
  background:rgba(25,26,44,.46);
  border-bottom-color:rgba(255,255,255,.1);
}
[data-theme=night] .landing-user-details{
  background:rgba(25,26,44,.52);
}

@media (max-width: 480px){
  .landing{
    padding:12px 12px 22px;
    gap:12px;
  }
  .landing-card{
    border-radius:20px;
  }
  .landing-card-header{
    padding:11px 13px 10px;
  }
  .landing-card-body{
    padding:9px 10px 10px;
  }
  .landing-profile-scroll{
    max-height:clamp(115px, 22dvh, 185px);
  }
  .landing-roles-scroll{
    max-height:clamp(180px, 36dvh, 320px);
  }
}

@media (min-width: 900px){
  .landing{
    max-width:620px;
  }
  .landing-roles-scroll{
    max-height:clamp(220px, 40dvh, 400px);
  }
}

/* UI/UX 01-B — Personal & Per-Role Avatar Management (Liquid Glass) */
.avatar,
.widget-avatar,
.chat-contact-avatar,
.focus-companion-avatar{
  position:relative;
  overflow:visible;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.avatar-fallback{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  line-height:1;
}
.avatar-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border-radius:inherit;
  object-fit:cover;
  object-position:center;
  display:block;
  z-index:1;
  opacity:0;
  transition:opacity .15s ease;
}
.has-avatar-img.avatar-loaded .avatar-img{
  opacity:1;
}
.has-avatar-img.avatar-loaded .avatar-fallback{
  opacity:0;
}
.avatar-frame{
  z-index:2;
  pointer-events:none;
}

.avatar-editor-card{
  margin-bottom:14px;
  padding:14px 16px;
  border-radius:22px;
  background:var(--glass-fill);
  border:1px solid var(--glass-stroke);
  box-shadow:var(--glass-darkshadow);
  backdrop-filter:blur(26px) saturate(180%);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
}
.avatar-editor-row{
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.avatar-preview-box{
  width:64px;
  height:64px;
  border-radius:20px;
  font-size:24px;
  box-shadow:0 8px 20px rgba(45, 36, 56, .12);
}
.avatar-editor-meta{
  flex:1;
  min-width:180px;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.avatar-editor-title{
  font-size:13px;
  font-weight:750;
  color:var(--ink);
}
.avatar-editor-sub{
  font-size:11px;
  color:var(--muted);
  line-height:1.45;
}
.avatar-editor-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-top:3px;
}
.avatar-upload-label{
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.avatar-privacy-hint{
  margin-top:10px;
  padding-top:8px;
  border-top:1px solid rgba(150,140,170,.16);
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
}
[data-theme=night] .avatar-privacy-hint{
  border-top-color:rgba(255,255,255,.1);
}

/* ===== Track A: Character Daily AI Diary System & Long-Form Reading ===== */
.diary-task-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:14px;
}
.diary-task-card{
  padding:13px 15px;
  border-radius:20px;
  background:var(--glass-fill);
  border:1px solid var(--glass-stroke);
  box-shadow:var(--glass-darkshadow);
}
.diary-task-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}
.diary-task-title{
  display:block;
  font-size:13.5px;
  font-weight:750;
  color:var(--ink);
}
.diary-task-sub{
  margin-top:3px;
  font-size:11.5px;
  color:var(--muted);
  line-height:1.45;
}
.diary-task-badge{
  display:inline-flex;
  align-items:center;
  padding:3px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  border:1px solid rgba(120, 110, 145, 0.22);
  background:rgba(255, 255, 255, 0.48);
  color:var(--ink);
}
.diary-task-badge.generating{
  color:#2b6cb0;
  background:rgba(66, 153, 225, 0.14);
  border-color:rgba(66, 153, 225, 0.35);
}
.diary-task-badge.failed{
  color:#b8324f;
  background:rgba(225, 75, 110, 0.14);
  border-color:rgba(225, 75, 110, 0.35);
}
.diary-task-badge.awaiting{
  color:#8c5a2b;
  background:rgba(214, 158, 46, 0.16);
  border-color:rgba(214, 158, 46, 0.36);
}
.diary-task-error{
  margin-top:8px;
  padding:7px 10px;
  border-radius:12px;
  font-size:11.5px;
  line-height:1.45;
  color:#b8324f;
  background:rgba(225, 75, 110, 0.1);
  border:1px solid rgba(225, 75, 110, 0.24);
  word-break:break-word;
}
.diary-task-note{
  margin-top:7px;
  font-size:11.5px;
  line-height:1.45;

/* ==================== UI/UX 03-A: Liquid Glass Avatar Frame Modal Picker ==================== */
.frame-modal-backdrop{
  position:fixed;
  inset:0;
  z-index:120;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(24, 18, 34, 0.42);
  backdrop-filter:blur(12px) saturate(135%);
  -webkit-backdrop-filter:blur(12px) saturate(135%);
  animation:frameModalFadeIn 0.16s ease-out;
}
@keyframes frameModalFadeIn{

.frame-modal-sheet{
  width:min(640px, 100%);
  max-height:min(88dvh, 760px);
  display:flex;
  flex-direction:column;
  border-radius:26px;
  padding:18px 20px 16px;
  background:linear-gradient(155deg, rgba(255, 255, 255, 0.88), rgba(246, 241, 252, 0.82));

  box-shadow:

    inset 0 1px 0 rgba(255, 255, 255, 0.92);

  overflow:hidden;

.frame-modal-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  flex-shrink:0;
  padding-bottom:10px;
  border-bottom:1px solid rgba(150, 138, 172, 0.18);
}
.frame-modal-title{
  margin:0 0 3px;
  font-size:16.5px;
  font-weight:760;
  letter-spacing:-0.2px;
}
.frame-modal-close{
  width:32px;
  height:32px;
  border-radius:50%;
  border:1px solid rgba(150, 138, 172, 0.24);
  background:rgba(255, 255, 255, 0.65);
  color:var(--ink);
  font-size:19px;
  line-height:1;
  display:grid;
  place-items:center;
  flex-shrink:0;
  transition:background 0.15s ease, transform 0.12s ease;
}
.frame-modal-close:hover{
  background:rgba(255, 255, 255, 0.92);
}
.frame-modal-preview{
  display:flex;
  align-items:center;
  gap:16px;
  padding:13px 16px;
  margin-top:11px;
  border-radius:18px;
  background:rgba(255, 255, 255, 0.58);
  border:1px solid rgba(150, 138, 172, 0.22);
  flex-shrink:0;
}
.frame-adjust-toggle.active{
  background:color-mix(in srgb, var(--accent) 15%, rgba(255, 255, 255, 0.85));
  border-color:var(--accent);
}
.frame-adjust-drawer{
  margin-top:9px;
  padding:11px 14px;
  border-radius:16px;
  background:rgba(255, 255, 255, 0.56);
  border:1px solid rgba(150, 138, 172, 0.22);
  flex-shrink:0;
}
.frame-adjust-grid{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:10px;
}
.frame-adjust-grid label{
  font-size:11.5px;
  font-weight:650;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  gap:4px;
}
.frame-adjust-grid .field{
  padding:7px 9px !important;
  font-size:12.5px !important;
}
.frame-modal-sheet .frame-source-tabs{
  margin:10px 0 8px;
  flex-shrink:0;
}
.frame-modal-body{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding-right:2px;
}
.frame-modal-body .frame-grid{
  max-height:none;
  overflow-y:visible;
}
.frame-modal-footer{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid rgba(150, 138, 172, 0.2);
  flex-shrink:0;
}
.frame-modal-btn{
  min-width:108px;
  padding:10px 18px;
  border-radius:14px;
}
@media(max-width:520px){
  .frame-modal-backdrop{
    padding:10px;
  }
  .frame-modal-sheet{
    max-height:92dvh;
    padding:15px 14px 14px;
    border-radius:22px;
  }
  .frame-modal-preview{
    padding:11px 12px;
    gap:12px;
  }
  .frame-adjust-grid{
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:7px;
  }
  .frame-modal-footer .frame-modal-btn{
    flex:1;
  }
}
[data-theme=night] .frame-modal-sheet{
  background:linear-gradient(155deg, rgba(36, 41, 60, 0.92), rgba(26, 30, 46, 0.9));
  border-color:rgba(255, 255, 255, 0.16);
}
[data-theme=night] .frame-modal-preview,
[data-theme=night] .frame-adjust-drawer,

  background:rgba(24, 28, 44, 0.72);
  border-color:rgba(255, 255, 255, 0.14);

<script>
(() => {
  // src/core/revisions.ts
  function makeUid(prefix = "e") {
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
  }
  function ensureRevisionsList(role) {
    if (!Array.isArray(role.messageRevisions)) {
      role.messageRevisions = [];
    }
    return role.messageRevisions;
  }
  function getScopeMessages(role, scope) {
    if (scope === "chat") return role.chats;
    if (scope === "scene") return role.scene?.messages || [];
    if (scope === "play") return role.play?.messages || [];
    return [];
  }
  function getActiveMessages(messages) {
    if (!Array.isArray(messages)) return [];
    return messages.filter((m) => m && !["retracted", "superseded", "deleted"].includes(String(m.status)));
  }
  function getActiveEvents(events) {
    if (!Array.isArray(events)) return [];
    return events.filter((e) => e && e.status !== "retracted" && e.status !== "superseded");
  }
  function findLinkedEvents(role, msg) {
    if (!Array.isArray(role.events)) return [];
    return role.events.filter((e) => {
      if (e.status === "retracted" || e.status === "superseded") return false;
      if (e.messageId && e.messageId === msg.id) return true;
      if (e.detail === msg.text && Math.abs((e.at || 0) - (msg.at || 0)) <= 1e3) return true;
      return false;
    });
  }
  function invalidateChatSource(role, msg, nowTs) {
    role.pendingReplies = (role.pendingReplies || []).filter((job) => !job.sources?.some((source) => source.id === msg.id) && !(msg.replyTurnId && job.replyTurnId === msg.replyTurnId));
    if (msg.speaker !== "me") return;
    for (const reply of getActiveMessages(role.chats).filter((m) => m.replySourceIds?.includes(msg.id))) {
      const events = findLinkedEvents(role, reply);
      reply.status = "retracted";
      reply.editedAt = nowTs;
      for (const event of events) event.status = "superseded";
      ensureRevisionsList(role).push({ id: makeUid("rev"), scope: "chat", targetMessageId: reply.id, action: "retract", speaker: "char", previousText: reply.text, at: nowTs, reason: "\u8BE5\u56DE\u590D\u7684\u805A\u5408\u6765\u6E90\u5DF2\u4FEE\u6539\u6216\u64A4\u56DE", supersededEventIds: events.map((event) => event.id) });
    }
  }
  function editMessage(role, scope, messageId, newTextRaw, nowTs = Date.now()) {
    const newText = String(newTextRaw ?? "").trim();
    if (!newText) return { ok: false, reason: "\u6D88\u606F\u5185\u5BB9\u4E0D\u80FD\u4E3A\u7A7A" };
    const list = getScopeMessages(role, scope);
    const msg = list.find((m) => m.id === messageId && m.status !== "retracted");
    if (!msg) return { ok: false, reason: "\u672A\u627E\u5230\u76EE\u6807\u6D88\u606F" };
    if (msg.text === newText) return { ok: false, reason: "\u5185\u5BB9\u672A\u53D1\u751F\u53D8\u5316" };
    const prevText = msg.text;
    const linked = findLinkedEvents(role, msg);
    const supersededEventIds = [];
    for (const ev of linked) {
      ev.status = "superseded";
      supersededEventIds.push(ev.id);
      role.events.push({
        ...ev,
        id: makeUid("ev"),
        detail: newText,
        messageId: msg.id,
        status: "active"
      });
    }
    msg.text = newText;
    msg.editedAt = nowTs;
    msg.revisionCount = (msg.revisionCount || 0) + 1;
    if (scope === "chat") invalidateChatSource(role, msg, nowTs);
    for (const m of list) {
      if (m.quote?.id === msg.id) {
        m.quote.text = newText.slice(0, 160);
      }
    }
    let hadPendingReply = false;
    if (scope === "chat" && msg.speaker === "me" && Array.isArray(role.pendingReplies)) {
      const beforeLen = role.pendingReplies.length;
      role.pendingReplies = role.pendingReplies.filter((job) => job.replyTo !== msg.id);
      hadPendingReply = role.pendingReplies.length < beforeLen;
    }
    const revision = {
      id: makeUid("rev"),
      scope,
      targetMessageId: msg.id,
      action: "edit",
      speaker: msg.speaker,
      previousText: prevText,
      newText,

    function submitIntermission(text2) {
      const r = role(), p = r?.play;
      if (!r || !p || busy || !p.paused || !text2.trim()) return;
      ensureIntermission(p);
      const message = { id: uid(), speaker: "me", text: text2.trim(), at: now(), status: "active" };
      p.intermissionMessages.push(message);
      if (!save()) {
        p.intermissionMessages.pop();
        intermissionDraft = text2;
        const input = $("#intermission-input");
        if (input) input.value = text2;
        return;
      }
      intermissionDraft = "";
      syslog("intermission", "\u5E55\u95F4\u7528\u6237\u53D1\u8A00\u5DF2\u4FDD\u5B58\uFF1B\u7B49\u5F85\u722A\u5370\u89E6\u53D1\u56DE\u590D", { source: p.id });
      render(false);
      const area = $("#intermission-scroll");
      if (area) area.scrollTop = area.scrollHeight;
      $("#intermission-input")?.focus({ preventScroll: true });
    }
    async function requestIntermissionReply() {
      const r = role(), p = r?.play;
      if (!r || !p || busy || !p.paused) return;
      if (intermissionDraft.trim()) {
        notify("\u8FD9\u6BB5\u6587\u5B57\u5C1A\u672A\u53D1\u9001\uFF0C\u8BF7\u5148\u70B9\u53D1\u9001\uFF0C\u518D\u70B9\u722A\u5370\u3002");
        return;
      }
      const latest = getActiveMessages(p.intermissionMessages || []).filter((m) => m.speaker === "me").at(-1);
      if (!latest) {
        notify("\u5148\u53D1\u9001\u4E00\u6761\u5E55\u95F4\u6D88\u606F\uFF0C\u518D\u70B9\u722A\u5370\u8BF7 AI \u56DE\u590D\u3002");
        return;
      }
      if (!canUseRealModel(data.settings)) {
        notify("\u8BF7\u5148\u5728\u7EC8\u7AEF\u8FDE\u63A5 API\uFF1B\u5F53\u524D\u53D1\u8A00\u5DF2\u4FDD\u5B58\u5728\u672C\u5730\u3002");
        return;
      }
      busy = true;
      render(false);
      try {
        const reply = await apiReply(r, "intermission", latest.text);
        if (r.play !== p || !p.paused || !getActiveMessages(p.intermissionMessages || []).some((m) => m.id === latest.id)) return;
        for (const text2 of splitChatBubbles(reply, r)) p.intermissionMessages.push({ id: uid(), speaker: "char", text: text2, at: now(), status: "active", replyTo: latest.id });
        syslog("intermission", "\u7528\u6237\u901A\u8FC7\u722A\u5370\u89E6\u53D1\u620F\u5916 AI \u56DE\u590D", { source: p.id });
        save();
      } catch (e) {
        notify("\u5E55\u95F4\u56DE\u590D\u5931\u8D25\uFF1A" + (e instanceof Error ? e.message : String(e)) + "\uFF1B\u4F60\u7684\u53D1\u8A00\u5DF2\u4FDD\u7559\u3002");
      } finally {
        busy = false;
        render(false);
        const area = $("#intermission-scroll");
        if (area) area.scrollTop = area.scrollHeight;
      }
    }
    function rollBackPlay() {
      const r = role();
      const p = r?.play;
      if (!r || !p || !p.paused || busy) return;
      ensureIntermission(p);
      const lastMe = p.messages.map((m, i) => m.speaker === "me" && m.status !== "retracted" ? i : -1).filter((x) => x >= 0).at(-1);
      if (lastMe == null) {
        notify("\u8FD8\u6CA1\u6709\u53EF\u56DE\u9000\u7684\u620F\u5185\u56DE\u5408");
        return;
      }
      const rejected = p.messages.splice(lastMe);
      const entryIds = new Set(rejected.map((m) => m.id));
      r.events = r.events.filter(
        (e) => !(e.kind === "drama" && e.source === p.id && e.at >= rejected[0].at && (entryIds.has(e.messageId || "") || /你在戏里说过|的回复/.test(e.title)))
      );
      p.revisions.push({
        id: uid(),
        at: now(),
        kind: "rollback",
        messages: rejected
      });
      p.intermissionMessages.push({
        id: uid(),
        speaker: "note",
        text: `\u5DF2\u56DE\u9000\u4E00\u8F6E\u6F14\u51FA\uFF08${rejected.length} \u6761\u620F\u5185\u6D88\u606F\uFF09\uFF0C\u65E7\u7248\u672C\u4FDD\u5B58\u5728\u4FEE\u8BA2\u8BB0\u5F55\u3002`,
        at: now(),
        status: "active"
      });
      syslog("intermission", `\u56DE\u9000\u4E00\u8F6E\u620F\u5185\u4E92\u52A8\uFF1A${entryIds.size} \u6761\u6D88\u606F`, {
        source: p.id
      });
      save();
      render();
      notify("\u620F\u5185\u56DE\u5408\u5DF2\u56DE\u9000\uFF0C\u5E55\u95F4\u4FDD\u7559\u4FEE\u8BA2\u8BB0\u5F55");
    }

        stagedTerminalFrameName = f.name.replace(/\.[^.]+$/, "").slice(0, 32) || "\u81EA\u5B9A\u4E49\u5934\u50CF\u6846";
        render(false);
        notify("\u5DF2\u52A0\u8F7D\u5934\u50CF\u6846\u7D20\u6750\u9884\u89C8\uFF0C\u8BF7\u70B9\u51FB\u300C\u786E\u8BA4\u52A0\u5165\u5934\u50CF\u6846\u56FE\u5E93\u300D\u6216\u300C\u53D6\u6D88\u4E0A\u4F20\u300D");
        return;
      }
      if ((el.id === "frame-file" || el.dataset.frameUploadOwner) && el.files?.[0]) {
        const f = el.files[0];
        const allowedTypes = [
          "image/png",
          "image/svg+xml",
          "image/gif",
          "image/webp"
        ];
        if (f.size > 4 * 1024 * 1024 || !allowedTypes.includes(f.type)) {
          notify("\u8BF7\u4F7F\u7528 4MB \u4EE5\u5185\u7684 PNG / SVG / GIF / WebP \u5934\u50CF\u6846\u56FE\u7247");
          return;
        }
        const ownerType = el.dataset.frameUploadOwner === "user" ? "user" : "role";
        const staged = getActiveModalOrFormFrameDraft(
          ownerType,
          formMode === "edit" ? data.roles.find((x) => x.id === editingRoleId) : role()
        );
        syncModalAdjustInputsToStaged(ownerType, staged);
        void (async () => {
          try {
            const mediaId = makeUid("frm_u");
            await mediaPut(mediaId, f);
            const customId = makeUid("cf");
            const cleanName = f.name.replace(/\.[^.]+$/, "").slice(0, 32) || "\u81EA\u5B9A\u4E49\u5934\u50CF\u6846";
            if (!Array.isArray(data.customFrames)) data.customFrames = [];
            data.customFrames.unshift({
              id: customId,
              name: cleanName,
              mediaId,
              createdAt: now()
            });
            staged.frameId = customId;
            staged.frameMediaId = mediaId;
            staged.frameData = "";
            if (!staged.frameScale) staged.frameScale = 1.25;
            syslog("ui", `\u4E0A\u4F20\u81EA\u5B9A\u4E49\u5934\u50CF\u6846\u7D20\u6750\u5E76\u52A0\u5165\u9884\u89C8\uFF1A${cleanName}`);
            save();
            if (frameModalOwner && document.querySelector('[data-testid="avatar-frame-modal"]')) {
              patchFrameModalBodyAndTabsInPlace(ownerType);
            } else {
              render(false);
            }
            notify(`\u5DF2\u4E0A\u4F20\u300C${cleanName}\u300D\u5E76\u653E\u5165\u5F53\u524D\u5F39\u7A97\u9884\u89C8\uFF08\u70B9\u51FB\u300C\u5E94\u7528\u300D\u540E\u5199\u5165\u7F16\u8F91\u8349\u7A3F\uFF09`);
          } catch (err) {
            const msg = err instanceof Error ? err.message : String(err);
            notify("\u4E0A\u4F20\u81EA\u5B9A\u4E49\u5934\u50CF\u6846\u5931\u8D25\uFF1A" + msg);
          }
        })();
        return;
      }
      if (el.id === "photo-upload") {
        sendFileAttachment(
          el.files?.[0],
          "photo",
          $("#photo-caption")?.value || ""
        );
      }
      if (el.id === "sticker-upload") {
        sendFileAttachment(
          el.files?.[0],
          "sticker",
          $("#sticker-caption")?.value || ""
        );
      }
      if (el.id === "audio-upload") {
        sendFileAttachment(
          el.files?.[0],
          "voice",
          $("#voice-caption")?.value || ""
        );
      }
      if (el.id === "backup-file" || el.id === "landing-backup-file") {
        importBackup(el.files?.[0]);
      }
    });
    appRoot.addEventListener("input", (e) => {
      const el = e.target;
      if (el.id === "message-input") chatDraft = el.value;
      if (el.id === "novel-input") novelDraft = el.value;
      if (el.id === "intermission-input") intermissionDraft = el.value;
      if (el.id === "focus-task-input") {
        focusTaskInputDraft = el.value;
        return;
      }
      if (el.id === "focus-minutes-slider") {
        ensureFocusData();
        const mins = clampFocusMinutes(Number(el.value) || FOCUS_DEFAULT_MINUTES, true);
        data.focus.workMinutes = mins;
        const clockEl = document.querySelector('[data-testid="focus-planned-clock"]');
        if (clockEl) clockEl.textContent = `${String(mins).padStart(2, "0")}:00`;
        const labelEl = document.querySelector('[data-testid="focus-planned-label"]');
        if (labelEl) labelEl.textContent = `${mins} \u5206\u949F`;
        const startBtnEl = document.querySelector('[data-testid="start-focus-btn"]');
        if (startBtnEl) startBtnEl.textContent = `\u5F00\u59CB\u4E13\u6CE8 \xB7 ${mins} \u5206\u949F`;
        return;
      }
      if (el.id === "terminal-staged-frame-name") {
        stagedTerminalFrameName = el.value;
        return;
      }
      if (el.dataset.frameAdjustInput) {
        const ownerType = el.dataset.owner === "user" ? "user" : "role";
        const staged = getActiveModalOrFormFrameDraft(
          ownerType,
          formMode === "edit" ? data.roles.find((x) => x.id === editingRoleId) : role()
        );
        const field = el.dataset.frameAdjustInput;
        if (field === "size") {
          staged.frameScale = Math.max(0.5, Math.min(3, Number(el.value) || 1.25));
        } else if (field === "x") {
          staged.frameX = Math.max(-80, Math.min(80, Number(el.value) || 0));
        } else if (field === "y") {
          staged.frameY = Math.max(-80, Math.min(80, Number(el.value) || 0));
        }
        document.querySelectorAll(".frame-live-preview .avatar-frame").forEach((imgEl) => {
          imgEl.style.setProperty("--frame-size", String(staged.frameScale));
          imgEl.style.setProperty("--frame-x", `${staged.frameX}px`);
          imgEl.style.setProperty("--frame-y", `${staged.frameY}px`);
        });
        return;
      }
      if (el.id === "frame-search-input") {
        const ownerType = frameModalOwner || "role";
        frameGallerySearch = el.value;
        frameGalleryPage = 0;
        patchFrameModalPresetGridInPlace(ownerType);
        return;
      }
    });
    appRoot.addEventListener("keydown", (e) => {
      const target = e.target;
      if (target.id === "focus-task-input" && e.key === "Enter" && !isComposing && !e.isComposing) {
        e.preventDefault();
        const addBtn = document.querySelector('[data-testid="focus-add-task-btn"]');
        addBtn?.click();
        return;
      }
      if (target.tagName === "TEXTAREA" && (target.id === "message-input" || target.id === "novel-input" || target.id === "intermission-input") && e.key === "Enter" && !e.shiftKey && !isComposing && !e.isComposing) {
        e.preventDefault();
        target.closest("form")?.requestSubmit();
      }
    });
    for (const roleItem of data.roles) {
      recoverChatTiming(roleItem);
      syncRoleDiaryTasks(roleItem, data.settings, now(), { resetGenerating: true });
    }
    save();
    if (canUseRealModel(data.settings)) {
      void processDiaryQueue();
    }
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        pumpChatSchedules();
        if (view === "home") homeTasks.refresh();
      }
    });
    window.addEventListener("pageshow", () => {
      pumpChatSchedules();
      if (view === "home") homeTasks.refresh();
    });
    if (typeof setInterval === "function") {
      setInterval(() => {
        if (view === "home") homeTasks.refresh();
        pumpChatSchedules();
        let chatDelivered = false;
        for (const item of data.roles) {
          if (deliverPending(item) && item.id === data.selected) chatDelivered = true;
        }
        let update = syncFocusMoments() || chatDelivered;
        update = completeFocusIfDue() || update;
        const currentLocalDay = toLocalDateKey(now());
        if (currentLocalDay !== lastObservedLocalDay) {
          lastObservedLocalDay = currentLocalDay;
          for (const roleItem of data.roles) {
            syncRoleDiaryTasks(roleItem, data.settings, now(), {
              ensureYesterday: true
            });
          }
          syslog("diary", `\u8DE8\u65E5\u68C0\u6D4B (00:00)\uFF1A\u5DF2\u4E3A\u5404\u89D2\u8272\u6392\u5165\u524D\u4E00\u65E5\u79C1\u4EBA\u65E5\u8BB0\u751F\u6210\u961F\u5217`);
          save();
          if (canUseRealModel(data.settings)) {
            void processDiaryQueue();
          }
          update = true;
        }
        document.querySelectorAll(".homescreen-time").forEach((el) => {
          const next = hm(Date.now());
          if (el.textContent !== next) el.textContent = next;
        });
        if (update && (view === "chat" || view === "focus" || view === "home" || view === "monitor" || view === "diary") && !busy) {
          const activeEl = document.activeElement;
          const intermissionTools = document.querySelector(
            "details.intermission-tools"
          );
          const deferFullRender = shouldDeferFullRenderOnTick({
            isComposing,
            activeTagName: activeEl?.tagName || "",
            activeElementId: activeEl?.id || "",
            chatPanelOpen: Boolean(chatPanel),
            editingMessageId,
            intermissionToolsOpen: Boolean(intermissionTools?.open)
          });
          if (deferFullRender) {
            patchDynamicRegionsOnTick();
          } else {
            render();
          }
        } else if (view === "focus") {
          renderFocusTick();
        }
      }, 850);
    }
    render();
    if (nainMigration.cleaned) notify("\u5948\u6069\u7684\u6F14\u793A\u5F00\u573A\u5DF2\u6E05\u7406\uFF0C\u89D2\u8272\u8D44\u6599\u4FDD\u7559\uFF0C\u6E05\u6863\u524D\u526F\u672C\u5DF2\u4FDD\u5B58\u3002");
    else if (nainMigration.error) notify(nainMigration.error);
  }

  // src/main.tsx
  initElsewhereApp();
})();

</script>
</body>
</html>
